# .github/workflows/validate-proposal.yml
# Copy this file into your agent repo to validate ADP proposals on every push.

name: Validate ADP Proposal

on:
  push:
    paths:
      - '**/*.proposal.json'
  pull_request:
    paths:
      - '**/*.proposal.json'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate proposals against schema
        run: |
          npm install -g ajv-cli ajv-formats
          find . -name '*.proposal.json' -exec ajv validate -s https://adp-manifest.dev/schema/v0.json -d {} \;
